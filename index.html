    <!-- Theme initialization script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('gp_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
